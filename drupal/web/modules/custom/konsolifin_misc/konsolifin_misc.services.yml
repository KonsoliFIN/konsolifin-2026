parameters:
  konsolifin_misc.skip_procedural_hook_scan: true

services:

  # Replaces hook_menu_alter() — alters the user/password route.
  konsolifin.route_subscriber:
    class: Drupal\konsolifin_misc\EventSubscriber\RouteSubscriber
    tags:
      - { name: event_subscriber }

  # Catches legacy URLs and immediately returns HTTP 410 Gone before routing.
  konsolifin_misc.gone_path_subscriber:
    class: Drupal\konsolifin_misc\EventSubscriber\GonePathSubscriber
    arguments:
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  konsolifin_misc.rss_feed:
    class: Drupal\konsolifin_misc\Service\RssFeedService
    arguments:
      - '@entity_type.manager'
      - '@path_alias.manager'
      - '@file_url_generator'
      - '@request_stack'
      - '@cache.default'
      - '@file_system'

  konsolifin_misc.editorial_calendar:
    class: Drupal\konsolifin_misc\Service\EditorialCalendarService
    arguments:
      - '@entity_type.manager'
      - '@date.formatter'
      - '@datetime.time'
      - '@config.factory'

  konsolifin_misc.datalayer:
    class: Drupal\konsolifin_misc\Service\DataLayerService
    arguments:
      - '@date.formatter'
  Drupal\konsolifin_misc\Service\DataLayerService: '@konsolifin_misc.datalayer'

  # OOP Hook implementations.
  Drupal\konsolifin_misc\Hook\KonsolifinMiscThemeHooks:
    autowire: true

  Drupal\konsolifin_misc\Hook\KonsolifinMiscPathautoHooks:
    autowire: true

  Drupal\konsolifin_misc\Hook\KonsolifinMiscFormHooks:
    autowire: true

  Drupal\konsolifin_misc\Hook\KonsolifinMiscPageAttachmentsHook:
    autowire: true
